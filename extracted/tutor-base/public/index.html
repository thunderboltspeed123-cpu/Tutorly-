<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kids Tutor</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2F6FED">
<link rel="icon" href="/icon-192.png">
<style>
  :root { --bg:#FFF8E7; --ink:#1F2A44; --accent:#2F6FED; --kid:#FFD84D; --card:#FFFFFF; --line:#E6DCC0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  .app { max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; gap:14px; padding:18px 16px; }
  h1 { margin:0; font-size:26px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  select, input, button { font:inherit; border-radius:14px; border:2px solid var(--line); padding:12px 14px; background:var(--card); color:var(--ink); }
  select { flex:1 1 140px; }
  #chat { flex:1; min-height:260px; background:var(--card); border:2px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; }
  .msg { max-width:88%; padding:12px 16px; border-radius:18px; font-size:18px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }
  .tutor { align-self:flex-start; background:#EAF1FF; }
  .kid { align-self:flex-end; background:var(--kid); }
  form { display:flex; gap:10px; }
  input { flex:1; min-width:0; font-size:18px; }
  button.send { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  /* Tablet (for example Galaxy Tab A11+): wider layout, bigger text and touch targets */
  @media (min-width: 768px) {
    .app { max-width:900px; padding:28px 32px; gap:20px; }
    h1 { font-size:36px; }
    select, input, button { padding:16px 20px; font-size:20px; border-radius:18px; }
    #chat { min-height:440px; padding:24px; gap:18px; }
    .msg { font-size:22px; padding:16px 22px; max-width:80%; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>Learning Buddy</h1>
  <div class="row">
    <select id="subject" aria-label="Subject"></select>
    <select id="age" aria-label="Age group"></select>
  </div>
  <div id="chat" aria-live="polite"></div>
  <form id="form">
    <input id="text" maxlength="500" placeholder="Type your question here" autocomplete="off" aria-label="Your message">
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>
<script>
  // Where the tutor server lives. Same site = "". If the app and server are on different sites, put the server address here.
  const SERVER = "";
  const SUBJECTS = ["General","Math","Science","Reading & Writing","English","Coding"];
  const AGES = ["5-7","8-10","11-13"];
  const chat = document.getElementById("chat"), text = document.getElementById("text"), send = document.getElementById("send");
  const subject = document.getElementById("subject"), age = document.getElementById("age");
  SUBJECTS.forEach(s => subject.add(new Option(s, s)));
  AGES.forEach(a => age.add(new Option("Age " + a, a)));
  age.value = "8-10";
  let messages = [];

  function add(role, content) {
    const d = document.createElement("div");
    d.className = "msg " + (role === "user" ? "kid" : "tutor");
    d.textContent = content;
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
    return d;
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  add("assistant", "Hi! I'm your learning buddy. What would you like to learn today?");

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const content = text.value.trim();
    if (!content) return;
    text.value = ""; send.disabled = true;
    messages.push({ role: "user", content });
    add("user", content);
    const pending = add("assistant", "Thinking…");
    try {
      const r = await fetch(SERVER + "/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, subject: subject.value, ageBand: age.value })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "Something went wrong.");
      pending.textContent = data.reply;
      messages.push({ role: "assistant", content: data.reply });
    } catch (err) {
      pending.textContent = err.message || "Something went wrong. Please try again.";
      messages.pop();
    } finally { send.disabled = false; text.focus(); chat.scrollTop = chat.scrollHeight; }
  });
</script>
</body>
</html>
